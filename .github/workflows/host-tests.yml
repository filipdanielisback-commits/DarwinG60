name: DarwinG60 host-side checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate device profile
        run: python tools/device_info.py --check
      - name: Validate hardware evidence ledger
        run: python tools/check_hardware_evidence.py
      - name: Build synthetic display/touch research profile
        run: python tools/display_touch_profile.py
      - name: Demonstrate synthetic display event pipeline
        run: python tools/display_event_demo.py
      - name: Demonstrate host graphical compositor
        run: python tools/compositor_demo.py
      - name: Demonstrate host system shell
        run: python tools/shell_demo.py
      - name: Render synthetic shell SVG preview
        run: python tools/render_shell.py
      - name: Verify generated SVG preview
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('build/darwing60-shell-demo.svg')"
      - name: Upload synthetic shell preview
        uses: actions/upload-artifact@v4
        with:
          name: darwing60-shell-preview
          path: build/darwing60-shell-demo.svg
          if-no-files-found: error
      - name: Audit XNU source and build readiness
        run: python tools/xnu_readiness.py
      - name: Run project checker
        run: python tools/dg60_check.py

  xnu-macos-environment:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out repository and pinned XNU source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Probe macOS XNU build prerequisites
        run: python3 tools/xnu_macos_environment.py
      - name: Attempt upstream XNU ARM64 DEVELOPMENT build
        working-directory: kernel/xnu/upstream
        shell: bash
        run: |
          evidence="$GITHUB_WORKSPACE/kernel/xnu/build-evidence"
          mkdir -p "$evidence"
          sdkroot="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$sdkroot" > "$evidence/build-status.txt"
          set +e
          make SDKROOT="$sdkroot" ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT -j2 > "$evidence/build.log" 2>&1
          status=$?
          set -e
          echo "make_exit_code=$status" >> "$evidence/build-status.txt"
          artifact="$(find BUILD -type f -name 'kernel.development*' -print -quit 2>/dev/null || true)"
          if [ -n "$artifact" ]; then
            cp "$artifact" "$evidence/$(basename "$artifact")"
            echo "artifact=$artifact" >> "$evidence/build-status.txt"
          else
            echo "artifact=NOT_FOUND" >> "$evidence/build-status.txt"
          fi
          if [ "$status" -eq 0 ] && [ -n "$artifact" ]; then
            echo "result=success" >> "$evidence/build-status.txt"
          else
            echo "result=not_verified" >> "$evidence/build-status.txt"
          fi
      - name: Upload XNU ARM64 build attempt evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-arm64-build-attempt
          path: kernel/xnu/build-evidence/
          if-no-files-found: warn
      - name: Retry XNU ARM64 build with explicit Darwin 24.0.0 version override
        working-directory: kernel/xnu/upstream
        shell: bash
        run: |
          evidence="$GITHUB_WORKSPACE/kernel/xnu/build-evidence"
          sdkroot="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$sdkroot" > "$evidence/override-status.txt"
          echo "RC_DARWIN_KERNEL_VERSION=24.0.0 (experimental build metadata override)" >> "$evidence/override-status.txt"
          set +e
          RC_DARWIN_KERNEL_VERSION=24.0.0 make SDKROOT="$sdkroot" ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT -j2 > "$evidence/override-build.log" 2>&1
          status=$?
          set -e
          echo "make_exit_code=$status" >> "$evidence/override-status.txt"
          artifact="$(find BUILD -type f -name 'kernel.development*' -print -quit 2>/dev/null || true)"
          if [ -n "$artifact" ]; then
            cp "$artifact" "$evidence/override-$(basename "$artifact")"
            echo "artifact=$artifact" >> "$evidence/override-status.txt"
          else
            echo "artifact=NOT_FOUND" >> "$evidence/override-status.txt"
          fi
          if [ "$status" -eq 0 ] && [ -n "$artifact" ]; then
            echo "result=success" >> "$evidence/override-status.txt"
          else
            echo "result=not_verified" >> "$evidence/override-status.txt"
          fi
      - name: Upload XNU ARM64 override build evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-arm64-override-build-attempt
          path: kernel/xnu/build-evidence/
          if-no-files-found: warn
