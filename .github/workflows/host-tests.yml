name: DarwinG60 host-side checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate device profile
        run: python tools/device_info.py --check
      - name: Validate hardware evidence ledger
        run: python tools/check_hardware_evidence.py
      - name: Run project checker
        run: python tools/dg60_check.py
