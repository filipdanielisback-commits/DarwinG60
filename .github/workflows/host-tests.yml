name: DarwinG60 host-side checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate device profile
        run: python tools/device_info.py --check
      - name: Validate hardware evidence ledger
        run: python tools/check_hardware_evidence.py
      - name: Build synthetic display/touch research profile
        run: python tools/display_touch_profile.py
      - name: Demonstrate synthetic display event pipeline
        run: python tools/display_event_demo.py
      - name: Demonstrate host graphical compositor
        run: python tools/compositor_demo.py
      - name: Demonstrate host system shell
        run: python tools/shell_demo.py
      - name: Render synthetic shell SVG preview
        run: python tools/render_shell.py
      - name: Verify generated SVG preview
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('build/darwing60-shell-demo.svg')"
      - name: Upload synthetic shell preview
        uses: actions/upload-artifact@v4
        with:
          name: darwing60-shell-preview
          path: build/darwing60-shell-demo.svg
          if-no-files-found: error
      - name: Audit XNU source and build readiness
        run: python tools/xnu_readiness.py
      - name: Run project checker
        run: python tools/dg60_check.py

  xnu-macos-environment:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out repository and pinned XNU source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Probe macOS XNU build prerequisites
        run: python3 tools/xnu_macos_environment.py
      - name: Prepare pinned XNU source dependencies and inspect matching KDK
        run: bash tools/xnu_prepare_dependencies.sh
      - name: Build XNU ARM64 DEVELOPMENT kernel
        working-directory: kernel/xnu/upstream
        shell: bash
        run: |
          evidence="$GITHUB_WORKSPACE/kernel/xnu/build-evidence"
          # The pinned XNU README documents SDKROOT, ARCH_CONFIGS and
          # KERNEL_CONFIGS as the kernel-build inputs. It also documents
          # RC_DARWIN_KERNEL_VERSION as an override for the version normally
          # discovered from System.kext in the SDK or KDK. Therefore a KDK is
          # not an unconditional compile prerequisite for this source build.
          # Keep KDK optional; it may be needed for KDK-specific debug symbols
          # or later debugging workflows, not for this initial compile attempt.
          echo "build_target=ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT" > "$evidence/kernel-build-status.txt"
          echo "SDKROOT=$SDKROOT" >> "$evidence/kernel-build-status.txt"
          echo "KDKROOT=${KDK_ROOT:-NOT_INSTALLED}" >> "$evidence/kernel-build-status.txt"
          if [[ -n "$KDK_ROOT" ]]; then
            echo "kdk_status=matching_kdk_detected" >> "$evidence/kernel-build-status.txt"
          else
            echo "kdk_status=not_installed_build_attempt_uses_explicit_xnu_version" >> "$evidence/kernel-build-status.txt"
          fi
          # The public XNU tag lists DriverKit headers in its export rules,
          # but the corresponding standalone .h files are absent from the
          # public iokit/DriverKit source directory (only .iig interfaces exist).
          # The generic kernel build does not need to export the DriverKit SDK.
          # Narrowly omit DriverKit from this CI runner's export traversal;
          # leave the pinned upstream submodule and all other exports intact.
          python3 - <<'PY'
          from pathlib import Path
          makefile = Path("iokit/Makefile")
          source = makefile.read_text()
          expected = "EXPINC_SUBDIRS = IOKit DriverKit Exclaves"
          replacement = "EXPINC_SUBDIRS = IOKit Exclaves"
          if source.count(expected) != 1:
              raise SystemExit("Expected exactly one pinned XNU iokit export rule; refusing an ambiguous patch")
          makefile.write_text(source.replace(expected, replacement))
          print("ci_driverkit_header_export=skipped_for_generic_kernel_build")
          PY
          echo "driverkit_export=omitted_from_generic_kernel_header_export_only" >> "$evidence/kernel-build-status.txt"
          # XNU's own README documents the exporthdrs pass before all for
          # multi-architecture builds. Run it explicitly so generated export
          # include trees (including libsa) exist before compilation.
          set +e
          make SDKROOT="$SDKROOT" KDKROOT="$KDK_ROOT" RC_DARWIN_KERNEL_VERSION=24.0.0 ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT BUILD_LTO=0 -j2 exporthdrs > "$evidence/kernel-build.log" 2>&1
          export_status=$?
          echo "exporthdrs_exit_code=$export_status" >> "$evidence/kernel-build-status.txt"
          if [ "$export_status" -eq 0 ]; then
            make SDKROOT="$SDKROOT" KDKROOT="$KDK_ROOT" RC_DARWIN_KERNEL_VERSION=24.0.0 ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT BUILD_LTO=0 -j2 all >> "$evidence/kernel-build.log" 2>&1
            status=$?
          else
            status=$export_status
          fi
          set -e
          echo "make_exit_code=$status" >> "$evidence/kernel-build-status.txt"
          artifact="$(find BUILD -type f -name 'kernel.development*' -size +0c -print -quit 2>/dev/null || true)"
          if [ -n "$artifact" ]; then
            cp "$artifact" "$evidence/$(basename "$artifact")"
            shasum -a 256 "$evidence/$(basename "$artifact")" > "$evidence/kernel-artifact.sha256"
            echo "artifact=$artifact" >> "$evidence/kernel-build-status.txt"
          else
            echo "artifact=NOT_FOUND" >> "$evidence/kernel-build-status.txt"
          fi
          shasum -a 256 "$evidence/kernel-build.log" > "$evidence/kernel-build.log.sha256"
          if [ "$status" -eq 0 ] && [ -n "$artifact" ]; then
            echo "result=success" >> "$evidence/kernel-build-status.txt"
          else
            echo "result=not_verified" >> "$evidence/kernel-build-status.txt"
            exit 1
          fi
      - name: Upload XNU dependency and kernel build evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-arm64-build-evidence
          path: kernel/xnu/build-evidence/
          if-no-files-found: warn
